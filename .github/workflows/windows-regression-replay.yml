name: Windows regression replay
on:
  push:
    branches: [qa/collector-regression-2026-11-17]
    paths: [.github/workflows/windows-regression-replay.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare document parsers and desktop test prerequisites
        shell: pwsh
        run: |
          python -m pip install -r requirements-documents.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = '1.0.4258.31'
          $sdk = Join-Path $env:USERPROFILE ".nuget/packages/microsoft.web.webview2/$version"
          if (!(Test-Path "$sdk/lib/net462/Microsoft.Web.WebView2.Core.dll")) {
            $package = Join-Path $env:RUNNER_TEMP 'webview2.zip'
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" -OutFile $package
            Expand-Archive $package -DestinationPath $sdk -Force
          }
          git config --global user.name 'Process Collector QA'
          git config --global user.email 'qa@localhost'
      - name: Run repository Python tests
        run: python -I -B -m unittest discover -s tests -v
